<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex Desk Pet</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="stage" id="stage" aria-label="Codex 桌宠">
      <section class="bubble is-visible" id="bubble" aria-live="polite" data-interactive>
        <span class="status-dot" aria-hidden="true"></span>
        <span id="bubble-text">单击互动，双击打开 Codex</span>
      </section>

      <nav class="controls" aria-label="桌宠控制" data-interactive>
        <button id="open-button" type="button" title="打开 Codex" aria-label="打开 Codex">⌘</button>
        <button id="hide-button" type="button" title="隐藏桌宠" aria-label="隐藏桌宠">×</button>
      </nav>

      <div class="character-wrap" id="character" data-interactive role="button" tabindex="0" aria-label="双击打开 Codex，可拖动">
        <div class="spark spark-one" aria-hidden="true">✦</div>
        <div class="spark spark-two" aria-hidden="true">·</div>
        <img src="../assets/pet.png" alt="戴眼镜、穿灰色毛衣的 Codex 桌宠" draggable="false">
        <div class="ground-shadow" aria-hidden="true"></div>
      </div>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
